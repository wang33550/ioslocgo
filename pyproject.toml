[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ioslocgo"
version = "0.1.0"
description = "iOS 模拟定位命令行工具，内置国内坐标系转换与 Windows 环境自检"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["ios", "location", "gcj02", "wgs84", "pymobiledevice3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pymobiledevice3>=11.19.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/wang33550/ioslocgo"
Issues = "https://github.com/wang33550/ioslocgo/issues"

[project.scripts]
ioslocgo = "ioslocgo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ioslocgo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
