name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 测试不接触真实设备，无需安装 pymobiledevice3 的全部依赖。
      # lzfse / pyimg4 在缺少 C 编译器的环境下无法构建，此处一并跳过。
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install --no-deps pymobiledevice3
          python -m pip install -e . --no-deps
          python -m pip install pytest ruff

      - name: Lint
        run: ruff check ioslocgo tests

      - name: Test
        run: python -m pytest -q
