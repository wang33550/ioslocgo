name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 依赖清单见 requirements-ci.txt，其中说明了为何跳过 lzfse 与 pyimg4。
      # 不使用行连接符，Windows runner 默认 shell 为 PowerShell，语法不兼容。
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install --no-deps pymobiledevice3 ipsw_parser
          python -m pip install -r requirements-ci.txt
          python -m pip install -e . --no-deps
          python -m pip install pytest ruff

      - name: Lint
        run: ruff check ioslocgo tests

      - name: Test
        run: python -m pytest -q
